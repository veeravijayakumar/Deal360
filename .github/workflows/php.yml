name: PHP Code Check

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-check:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      # 3. Show PHP version
      - name: Check PHP version
        run: php -v

      # 4. Check all PHP files for syntax errors
      - name: Check PHP syntax
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Checking PHP files..."
          echo "======================================"

          FAILED=0
          COUNT=0

          while IFS= read -r -d '' file; do
            COUNT=$((COUNT + 1))

            echo ""
            echo "Checking: $file"

            if php -l "$file"; then
              echo "OK: $file"
            else
              echo "FAILED: $file"
              FAILED=1
            fi

          done < <(
            find . \
              -type f \
              -name "*.php" \
              -not -path "./.git/*" \
              -not -path "./vendor/*" \
              -print0
          )

          echo ""
          echo "======================================"
          echo "PHP files checked: $COUNT"
          echo "======================================"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No PHP files were found."
            exit 1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "ERROR: One or more PHP files contain syntax errors."
            exit 1
          fi

          echo ""
          echo "SUCCESS: All PHP files passed syntax checking."

      # 5. Check that important project files exist
      - name: Check project files
        shell: bash
        run: |
          echo "Checking project structure..."

          if [ -f "index.php" ]; then
            echo "OK: index.php found"
          else
            echo "WARNING: index.php not found"
          fi

          if [ -f "composer.json" ]; then
            echo "OK: composer.json found"
          else
            echo "INFO: composer.json not found - Composer is not required"
          fi

          echo "Project structure check completed."
